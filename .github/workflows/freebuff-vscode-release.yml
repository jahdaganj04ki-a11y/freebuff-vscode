name: Freebuff VS Code Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'freebuff/vscode/**'
      - 'common/src/**'
      - 'sdk/src/**'
      - 'packages/**'
      - 'agents/**'
      - '.github/workflows/freebuff-vscode-release.yml'

jobs:
  build:
    name: Build & Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The extension bundles the monorepo SDK from source (sdk/src, common/src,
      # packages/*), so those files' own imports (zod, ai, @ai-sdk/*, …) must be
      # resolvable. A root workspace install provides them in the root
      # node_modules that tsc and esbuild walk up to.
      - name: Install monorepo workspace dependencies
        run: bun install

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install extension dependencies
        working-directory: freebuff/vscode
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: freebuff/vscode
        run: npm run typecheck

      - name: Build bundles
        working-directory: freebuff/vscode
        run: npm run build

      - name: Copy runtime assets
        working-directory: freebuff/vscode
        run: npm run copy-assets

      - name: Package VSIX
        working-directory: freebuff/vscode
        run: npx vsce package --no-dependencies --allow-missing-repository -o freebuff-vscode.vsix

      - name: Audit VSIX contents
        working-directory: freebuff/vscode
        run: npx vsce ls --no-dependencies | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: freebuff-vscode
          path: freebuff/vscode/freebuff-vscode.vsix
